[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-pricing-capital"
version = "0.1.0"
description = "Motor Insurance Pricing and Underwriting Capital: GLMs, Extreme-Value Tails and Reinsurance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Muavia" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.2"]
report = ["playwright==1.47.0"]   # PDF generation via Chromium (scripts/make_pdf.py)

[tool.setuptools.packages.find]
where = ["src"]
